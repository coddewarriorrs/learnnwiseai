
services:
  db:
    image: postgres:16-alpine
    container_name: learnwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnwise
      POSTGRES_PASSWORD: learnwisepassword2026
      POSTGRES_DB: learnwisedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnwise -d learnwisedb"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnwise-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://learnwise:learnwisepassword2026@db:5432/learnwisedb
      JWT_SECRET: learnwise-super-secret-key-change-in-prod-2026-hackathon
      JWT_REFRESH_SECRET: learnwise-refresh-super-secret-key-2026
      AI_PROVIDER: fallback
      AI_MODEL: gemini-1.5-flash
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnwise-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/ws/teacher
    depends_on:
      - backend

volumes:
  postgres_data:
